name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: "Build and Test - Node"
    runs-on: ubuntu-latest

    # strategy:
    #   fail-fast: false
    #   matrix:
    #     node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # node-version: ${{ matrix.node }}
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Generate tag
        id: generate_tag
        run: |
          SHA="${GITHUB_SHA:0:7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Login into the container registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: mariosalvador/first-step-ci:${{ steps.generate_tag.outputs.sha }}

      # - name: Build docker image
      #   run: docker build -t mariosalvador/first-step-ci:${{ steps.generate_tag.outputs.sha }} .

      # - name: Push docker image
      #   run: docker push mariosalvador/first-step-ci:${{ steps.generate_tag.outputs.sha }}
