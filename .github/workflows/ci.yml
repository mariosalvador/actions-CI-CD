name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: "Build and Test - Node"
    runs-on:
      ubuntu-latest

      # strategy:
    #   fail-fast: false
    #   matrix:
    #     node: [20, 22, 24]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # node-version: ${{ matrix.node }}
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Generate tag
        id: generate_tag
        run: |
          SHA="${GITHUB_SHA:0:7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::652656942111:role/ecr-role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build docker image
        id: build-docker
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          TAG: ${{steps.generate_tag.outputs.sha}}
        run: |
          docker build -t $REGISTRY/ecr-reposi:$TAG .
          docker push $REGISTRY/ecr-reposi:$TAG
          IMAGE="$REGISTRY/ecr-reposi:$TAG"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: app-runner
          image: ${{steps.build-docker.outputs.image}}
          access-role-arn: arn:aws:iam::652656942111:role/app-runner-role
          region: us-east-1
          cpu: 1
          memory: 2
          port: 3000

